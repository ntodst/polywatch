[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-watch"
version = "0.2.0"
description = "Public, real-time Polymarket whale and profitable wallet terminal monitor"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "rich>=14.2,<15", "textual>=8.2,<9"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
polywatch = "polywatch.cli:main"

[tool.setuptools.packages.find]
include = ["polywatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
